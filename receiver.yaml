
apiVersion: apps/v1
kind: Deployment
metadata:
  name: receiver
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: receiver
  template:
    metadata:
      labels:
        app: receiver
    spec:
      containers:
        - name: receiver
          image: receiver:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SENDER_URL
              value: "http://sender:8081"
---
apiVersion: v1
kind: Service
metadata:
  name: receiver
spec:
  selector:
    app: receiver
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
